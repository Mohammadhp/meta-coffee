services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: metacoffee
      POSTGRES_USER: metacoffee
      POSTGRES_PASSWORD: metacoffee
    ports:
      - "5433:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metacoffee -d metacoffee"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  dbdata:
