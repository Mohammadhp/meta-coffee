{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}متاکافی{% endblock %}</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="{% url 'home' %}" class="brand">متاکافی</a>
      <nav class="site-nav">
        <a href="{% url 'search' %}">جستجو</a>
        <a href="{% url 'seller_index' %}">فروشنده‌ها</a>
        <a href="{% url 'blog_index' %}">مجله</a>
      </nav>
    </div>
  </header>

  <main class="container">{% block content %}{% endblock %}</main>

  <footer class="site-footer">
    <div class="container">
      <p>متاکافی — جستجو و کشف قهوه در ایران</p>
    </div>
  </footer>
</body>
</html>
