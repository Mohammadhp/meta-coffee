{% extends "base.html" %}
{% block title %}متاکافی — جستجوی قهوه ایران{% endblock %}
{% block content %}

  <form action="{% url 'search' %}" method="get">
    <input type="text" name="q" placeholder="مثلاً برزیل شکلاتی یا آسیاب دستی">

  <p><a href="{% url 'search' %}">مرور همه</a></p>
