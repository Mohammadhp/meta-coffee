{% extends "base.html" %}
{% block title %}مجله متاکافی{% endblock %}
{% block content %}
  <h1>مجله</h1>
  <ul>
    {% for p in posts %}
      <li><a href="{{ p.get_absolute_url }}">{{ p.title }}</a></li>
    {% empty %}
      <li>هنوز مطلبی منتشر نشده.</li>
    {% endfor %}
  </ul>
{% endblock %}
